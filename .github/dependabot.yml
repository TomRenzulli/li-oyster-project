version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(deps)'
    groups:
      astro:
        patterns: ['astro', '@astrojs/*']
      dev-tooling:
        patterns: ['eslint*', 'prettier*', '@eslint/*', 'typescript*', 'husky', 'lint-staged']

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(actions)'
