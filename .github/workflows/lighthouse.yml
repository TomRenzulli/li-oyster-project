name: lighthouse

# Cloudflare Pages deploys this repo through its own Git integration. When a
# deployment finishes, Cloudflare reports it back to GitHub as a deployment
# status carrying the URL it was served at. That event is what triggers this
# workflow, so Lighthouse always measures the exact artifact Cloudflare built
# and served — real headers, real compression, real CDN — without Actions
# holding a deploy credential or guessing a preview hostname.
#
# Note on `deployment_status`: GitHub always runs the copy of this file that is
# on the default branch, and never checks out the deployed commit. Nothing here
# depends on repository contents, so that is fine; the only inputs are the URL
# from the event payload and lighthouserc.json, which is read from the default
# branch on purpose so the release floor cannot be lowered by a feature branch.

on:
  deployment_status:

permissions:
  contents: read

concurrency:
  # One audit per deployed URL. A rapid second push supersedes the first.
  group: lighthouse-${{ github.event.deployment_status.environment_url }}
  cancel-in-progress: true

jobs:
  audit:
    name: Lighthouse CI (95 floor)
    runs-on: ubuntu-latest
    # Deployment statuses arrive for 'queued', 'in_progress' and 'failure' too.
    # Only a successful deployment with a reachable URL is worth auditing, and
    # only one Cloudflare produced — anything else could point the audit at an
    # arbitrary host supplied by whoever created the deployment.
    if: >-
      github.event.deployment_status.state == 'success' &&
      github.event.deployment_status.environment_url != '' &&
      (
        endsWith(github.event.deployment_status.environment_url, '.pages.dev') ||
        github.event.deployment_status.environment_url == 'https://longislandoysterfarm.com'
      )
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Report what is being audited
        env:
          URL: ${{ github.event.deployment_status.environment_url }}
          ENVIRONMENT: ${{ github.event.deployment_status.environment }}
        run: |
          echo "Environment: $ENVIRONMENT"
          echo "URL: $URL"
          echo "### Lighthouse target" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$ENVIRONMENT\` — $URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Audit the Cloudflare deployment
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # 12.6.2
        with:
          # Two representative pages: the home page and the heaviest route
          # (the directory index, which carries the filter island).
          urls: |
            ${{ github.event.deployment_status.environment_url }}/
            ${{ github.event.deployment_status.environment_url }}/farms/
          configPath: ./lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true
