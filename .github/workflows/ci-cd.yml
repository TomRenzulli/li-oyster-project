name: ci-cd

# Checks only. Deployment is Cloudflare Pages' own Git integration: it builds
# from this repo directly (main -> production, develop -> staging preview), so
# no deploy credential ever enters GitHub Actions. The Lighthouse release gate
# runs here against a local preview of the build; lighthouse-production.yml
# audits the live site on a schedule.
# All third-party actions are pinned to a commit SHA, with the human-readable
# tag in the trailing comment. Dependabot bumps both together.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

# Least privilege by default. Jobs that need more ask for it themselves.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  secrets:
    name: Secret scan (TruffleHog)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: TruffleHog
        uses: trufflesecurity/trufflehog@4ef51f69ca6347aaa76a5e64a87eac9c0c909f71 # v3.100.1
        with:
          path: ./
          # Whole-repo scan including history: a key committed three months ago
          # is still a leaked key. Fails the job only on verified findings, so
          # the gate stays actionable instead of noisy.
          base: ''
          head: HEAD
          # The action already passes --fail itself; repeating it here is a
          # hard error ("flag 'fail' cannot be repeated").
          extra_args: --only-verified
          # Pin the scanner image too. The action SHA pins the wrapper, but the
          # wrapper's default is `trufflehog:latest` — an unpinned container
          # pulled on every run, which is the same supply-chain hole the SHA
          # pinning exists to close. Dependabot bumps the SHA; this version
          # moves with it. Note the image tag has no "v" prefix, unlike the
          # git tag. Verified 2026-11-21: ghcr tags `3.100.0` and `latest`
          # both resolve to sha256:8fd07ea46a3f59583c4d50f006d8cf150530141b
          # 28969c3c34cc455cb9165a6b.
          version: 3.100.0

  vulnerabilities:
    name: Dependency + filesystem scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table

  quality:
    name: Lint, format, types, audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Single source of truth, shared with Cloudflare Pages: Pages reads
          # .node-version too, so CI and the host provably agree. Pages does
          # NOT read package.json "engines", so that field cannot serve here.
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: ESLint
        run: npm run lint
      - name: Prettier check
        run: npm run format:check
      - name: Astro type check (includes Pages Functions)
        run: npm run typecheck
      - name: npm audit
        run: npm audit --audit-level=high
      - name: Data integrity (sources + last_verified on every listing)
        run: npm run verify:data

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [secrets, vulnerabilities, quality]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Single source of truth, shared with Cloudflare Pages: Pages reads
          # .node-version too, so CI and the host provably agree. Pages does
          # NOT read package.json "engines", so that field cannot serve here.
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Confirm security headers shipped with the build
        run: test -f dist/_headers && grep -q 'Content-Security-Policy' dist/_headers

      - name: Confirm the strict CSP is still satisfiable
        # The CSP has no script-src 'unsafe-inline' and no style-src
        # 'unsafe-inline'. Astro inlines small island scripts by default, which
        # would silently break every page under that policy, so assert the
        # build emitted none. application/ld+json is not a script type and is
        # not governed by script-src, so it is excluded.
        run: |
          if grep -rhoE '<script[^>]*>' dist --include='*.html' \
            | grep -v 'src=' | grep -v 'application/ld+json' | grep .; then
            echo "::error::Inline <script> found in the build; the CSP would block it."
            exit 1
          fi
          if grep -rqE '<style[^>]*>|style="' dist --include='*.html'; then
            echo "::error::Inline style found in the build; the CSP would block it."
            exit 1
          fi
          echo "No inline scripts or styles. CSP holds."

      - name: Check internal links
        run: npm run check:links

  lighthouse:
    name: Lighthouse (95 floor)
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Single source of truth, shared with Cloudflare Pages: Pages reads
          # .node-version too, so CI and the host provably agree. Pages does
          # NOT read package.json "engines", so that field cannot serve here.
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run build

      - name: Serve the build
        # Started as its own step rather than through Lighthouse CI's
        # `startServerCommand`, because `astro preview` in Astro 7
        # DAEMONIZES: it prints "Preview server running at ... (pid N)" and
        # the foreground process exits immediately. Lighthouse CI watches the
        # child it spawned, so it would conclude the server had died while the
        # server was in fact serving fine. Starting it here and polling for a
        # 200 sidesteps that entirely.
        run: |
          npx astro preview --port 4321 --host 127.0.0.1 &
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null http://127.0.0.1:4321/; then
              echo "Preview server up after ${i}s."
              exit 0
            fi
            sleep 1
          done
          echo "::error::Preview server never answered on 127.0.0.1:4321."
          exit 1

      - name: Audit the build
        # Audits the local preview of dist/ rather than the deployed site.
        # Cloudflare's Git integration emits no GitHub deployment event to
        # hang this off (see lighthouse-production.yml), and a gate that
        # cannot run is not a gate. Auditing locally keeps this blocking on
        # every PR, which is where a performance or accessibility regression
        # is cheapest to fix.
        #
        # What this does NOT measure: real CDN latency, Brotli, TLS, and the
        # headers in public/_headers (astro preview does not apply them). The
        # `build` job asserts the headers file ships and that no inline script
        # or style survives; lighthouse-production.yml covers the rest daily.
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # 12.6.2
        with:
          urls: |
            http://127.0.0.1:4321/
            http://127.0.0.1:4321/farms/
            http://127.0.0.1:4321/methodology/
          configPath: ./lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true

      - name: Stop the preview server
        if: always()
        run: npx astro preview stop || true
