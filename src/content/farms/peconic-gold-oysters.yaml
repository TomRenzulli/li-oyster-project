description: >-
  A Cutchogue farm growing oysters by hand in the Great Peconic Bay and selling
  them from a self-serve roadside stand on County Road 48, where a bag of two
  dozen sits alongside shucking knives and payment works on the honour system.
  The farm runs two size lines, a smaller classic and a larger one when
  available, and also sells through an online store. It carries NYS Grown &
  Certified and a Slow Food East End Snail of Approval.
