description: >-
  A woman-owned oyster farm growing in Gardiners Bay off Long Island's North
  Fork. Oysters are sold directly from a self-serve farmstand on weekends, and
  the farm takes bookings to get people out on the water to see how the bay is
  worked and to shuck a few. Seasonal preorders run around the holidays.
