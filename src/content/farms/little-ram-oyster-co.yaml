verification_notes: >-
  Open: town/hamlet is not stated on the site (it says only "Long Island's
  North Fork"), so `town` is deliberately omitted. The Suffolk County ALP lists
  a lease to "Cornelius & Little Ram Oyster Co. LLC" in Shelter Island township
  — plausibly related, but linking that legal entity to this business is an
  inference, so no lease record and no town is attached here. Phone, street
  address, wholesale, shipping, farming method and restoration involvement are
  not stated on the homepage. Sub-pages (/oysters, /our-story, /farmstand,
  /shop) were not read and may carry some of these.
